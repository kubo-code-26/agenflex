<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenflex • Agendamento</title>
<style>
:root{color-scheme:dark;--bg:#0b1319;--card:#121e27;--text:#fff;--muted:#a9bac6;--border:#304653;--accent:#00ad62}
[data-theme="light"]{color-scheme:light;--bg:#f1f5f9;--card:#fff;--text:#10202d;--muted:#4d6370;--border:#cbd5e1;--accent:#00874d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:24px 12px}main{max-width:540px;margin:auto;background:var(--card);padding:24px;border:1px solid var(--border);border-radius:20px}h1{margin:0}p{color:var(--muted);line-height:1.5}label{display:block;margin:18px 0 6px}input,select,button{font:inherit;border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--bg);color:var(--text)}input:not([type=checkbox]),select{width:100%}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}.service{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--border);border-radius:10px;margin:8px 0}.service label{margin:0;flex:1}.service small{color:var(--muted)}#slots{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.selected,#book{background:var(--accent);color:white}#book{width:100%;margin-top:20px;font-weight:700}#message{white-space:pre-wrap;line-height:1.5;margin-top:16px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a3ffd0;outline-offset:2px}fieldset{border:0;padding:0;margin:0}
</style>
</head><body><main>
<button type="button" id="theme" style="float:right" aria-label="Alternar tema">☀️ Claro</button><h1 id="name">Agenflex</h1><p id="loading">Carregando estabelecimento...</p>
<form id="form" hidden><fieldset id="fields">
<h2>Escolha os serviços</h2><div id="services"></div><p id="total"></p>
<label for="staff">Profissional</label><select id="staff"><option value="">Qualquer disponível</option></select>
<label for="date">Data</label><input id="date" type="date" required>
<label>Horários disponíveis (horário de Brasília)</label><div id="slots" aria-live="polite">Selecione pelo menos um serviço.</div>
<label for="client">Seu nome</label><input id="client" autocomplete="name" minlength="2" maxlength="120" required>
<label for="phone">WhatsApp com DDD</label><input id="phone" type="tel" autocomplete="tel" maxlength="20" required>
<p>Seus dados serão utilizados pelo estabelecimento para registrar e acompanhar este agendamento.</p>
<button id="book" type="submit">Solicitar agendamento</button>
</fieldset></form><div id="message" role="status" aria-live="polite"></div>
</main>
<script>
const BASE='https://oxusmmhkpesuubyyyyhx.supabase.co';
const KEY='sb_publishable_FVx2K9soCfJ_hczEuGRsOg_jjbqt4ds';
const $=id=>document.getElementById(id);
function setTheme(theme){document.documentElement.dataset.theme=theme;$('theme').textContent=theme==='light'?'🌙 Escuro':'☀️ Claro';try{localStorage.setItem('portal_theme',theme);}catch(_){}}
try{setTheme(localStorage.getItem('portal_theme')==='light'?'light':'dark');}catch(_){setTheme('dark');}
$('theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');
const slug=decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,''));
let catalog,selected=new Set(),time=null,busy=false,version=0,requestId=crypto.randomUUID();
const localDay=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
async function rpc(action,payload={}){
 const res=await fetch(BASE+'/rest/v1/rpc/agenflex_portal',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_slug:slug,p_action:action,p_payload:payload}),signal:AbortSignal.timeout(45000)});
 const data=await res.json();if(!res.ok)throw new Error(data.message||'Não foi possível concluir a solicitação.');return data;
}
function eligible(person){return [...selected].every(id=>!catalog.restrictions.some(r=>r.service_id===id&&r.restricted)||catalog.skills.some(x=>x.service_id===id&&x.collaborator_id===person.id));}
function renderStaff(){const old=$('staff').value;$('staff').replaceChildren(new Option('Qualquer disponível',''));for(const p of catalog.staff.filter(eligible))$('staff').append(new Option(p.name,p.id));if([...$('staff').options].some(o=>o.value===old))$('staff').value=old;}
async function loadSlots(){
 const thisVersion=++version;time=null;$('message').textContent='';$('slots').replaceChildren();
 if(!selected.size){$('slots').textContent='Selecione pelo menos um serviço.';return;}
 $('slots').textContent='Consultando a agenda...';
 try{
 const data=await rpc('availability',{service_ids:[...selected],collaborator_id:$('staff').value,date:$('date').value});
 if(thisVersion!==version)return;$('slots').replaceChildren();
 if(!data.slots.length)$('slots').textContent='Não há horários disponíveis. Escolha outro dia ou profissional.';
 for(const slot of data.slots){const b=document.createElement('button');b.type='button';b.textContent=slot.time;b.setAttribute('aria-pressed','false');b.onclick=()=>{time=slot.time;for(const node of $('slots').children){node.classList.remove('selected');node.setAttribute('aria-pressed','false');}b.classList.add('selected');b.setAttribute('aria-pressed','true');};$('slots').append(b);}
 }catch(e){if(thisVersion!==version)return;$('slots').textContent='Não foi possível consultar os horários.';$('message').textContent=e.message;const b=document.createElement('button');b.type='button';b.textContent='Tentar novamente';b.onclick=loadSlots;$('slots').append(b);}
}
$('date').onchange=loadSlots;$('staff').onchange=loadSlots;
$('form').onsubmit=async e=>{
 e.preventDefault();if(busy)return;
 if(!selected.size||!time){$('message').textContent='Selecione os serviços e um horário disponível.';return;}
 busy=true;$('fields').disabled=true;$('message').textContent='Enviando...';
 try{const data=await rpc('book',{request_id:requestId,service_ids:[...selected],collaborator_id:$('staff').value,start:`${$('date').value}T${time}:00`,name:$('client').value.trim(),phone:$('phone').value});$('message').textContent=data.message;$('book').textContent='Solicitação registrada';}
 catch(e){$('message').textContent=e.message+' Se a conexão caiu, tente novamente sem recarregar a página: o identificador da solicitação evita duplicação.';$('fields').disabled=false;busy=false;}
};
(async()=>{try{
 if(!slug)throw new Error('Abra o link completo fornecido pelo estabelecimento.');
 catalog=await rpc('catalog');$('name').textContent=catalog.name;
 const today=new Date();$('date').min=localDay(today);$('date').value=localDay(today);today.setDate(today.getDate()+90);$('date').max=localDay(today);
 for(const s of catalog.services){const box=document.createElement('div');box.className='service';const check=document.createElement('input');check.type='checkbox';check.id='service-'+s.id;const label=document.createElement('label');label.htmlFor=check.id;label.textContent=`${s.name} • ${s.duration} min • ${money(s.price)}`;box.append(check,label);$('services').append(box);check.onchange=()=>{check.checked?selected.add(s.id):selected.delete(s.id);const list=catalog.services.filter(x=>selected.has(x.id));$('total').textContent=`Total: ${list.reduce((n,x)=>n+x.duration,0)} min • ${money(list.reduce((n,x)=>n+Number(x.price),0))}`;renderStaff();loadSlots();};}
 renderStaff();$('loading').textContent='Escolha os serviços, o profissional e um horário.';$('form').hidden=false;
 }catch(e){$('loading').textContent='Portal indisponível.';$('message').textContent=e.message;}})();
</script></body></html>
